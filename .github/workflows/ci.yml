name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: sdk
        with:
          dotnet-version: |
            10.0.403
            6.0.423
      - name: Run model and installer tests
        run: ./tools/ci/Test-Windows.ps1
      - name: Build Widget, Bridge, PowerAgent and Setup
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./tools/ci/Build-SetupSmoke.ps1 -OutputRoot "${{ runner.temp }}/onextweaks-ci"
